name: Build Windows App

on:
  workflow_dispatch: # manuell über den Actions-Tab starten
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # nötig für das Release bei Tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Windows-Installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # keine Code-Signatur

      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-slideshow-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error

      - name: Release erstellen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
